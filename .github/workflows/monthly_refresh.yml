name: Monthly Data Refresh

on:
  schedule:
    - cron: '0 2 1 * *'   # 2am UTC on the 1st of each month
  workflow_dispatch:        # Allow manual trigger for testing

permissions:
  contents: write           # needed for git push at end of job

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6h — cold labeling of 10k books takes ~4-5h

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Get cache key (current month)
        id: date
        run: echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

      - name: Restore OL candidates cache
        id: cache-ol
        uses: actions/cache/restore@v4
        with:
          path: pipeline/raw/ol_candidates.ndjson
          key: ol-candidates-${{ steps.date.outputs.month }}

      - name: Restore labeled books cache
        id: cache-labeled
        uses: actions/cache/restore@v4
        with:
          path: pipeline/labeled/books_labeled.json
          key: books-labeled-${{ steps.date.outputs.month }}
          restore-keys: |
            books-labeled-

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          NYT_BOOKS_API_KEY:    ${{ secrets.NYT_BOOKS_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          PYTHONUNBUFFERED:     "1"
        run: |
          cd pipeline
          python 01_fetch_ol.py
          python 02_fetch_nyt.py
          python 04_clean.py
          python 05_enrich.py
          python 06_label.py
          python 07_embed.py
          python 08_umap.py
          python 09_author_graph.py
          python 10_timeline.py
          python 11_serialize.py

      - name: Save OL candidates cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/raw/ol_candidates.ndjson
          key: ol-candidates-${{ steps.date.outputs.month }}

      - name: Save labeled books cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/labeled/books_labeled.json
          key: books-labeled-${{ steps.date.outputs.month }}

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "data: monthly refresh $(date +%Y-%m)"
          git push
