<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNook</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <!-- GitHub Pages 404 redirect trick: redirect to index.html and pass the path as a hash -->
  <script>
    const path = window.location.pathname + window.location.search;
    window.location.replace('/' + window.location.pathname.split('/')[1] + '/#' + path);
  </script>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;">
    <div>
      <p style="font-family:var(--font-body);font-size:1.2rem;color:var(--text-muted);">Redirecting…</p>
    </div>
  </div>
</body>
</html>
